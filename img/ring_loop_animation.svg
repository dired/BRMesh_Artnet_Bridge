<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="monospace">
  <defs>
    <style>
      /* ===== Cursor: aligns to fixture, all fast phases ~560-630°/s, slow=blocking ~60-75°/s ===== */
      @keyframes cursorSpin {
        0%              { transform: rotate(0deg); }     /* 0.0s  L1 */
        10%             { transform: rotate(1800deg); }  /* 3.0s  L1 (5 revs, 600°/s) */
        26%             { transform: rotate(2160deg); }  /* 7.8s  L1 (1 slow rev: ALL→BLUE, 75°/s) */
        40%             { transform: rotate(4770deg); }  /* 12.0s L7 (2610° in 4.2s, 621°/s) */
        40.33%          { transform: rotate(4770deg); }  /* 12.1s BLOCKED at L7 */
        46.67%          { transform: rotate(5850deg); }  /* 14.0s L7 (1080° in 1.9s, 568°/s) */
        47%             { transform: rotate(5850deg); }  /* 14.1s BLOCKED at L7 */
        53.33%          { transform: rotate(6840deg); }  /* 16.00s L1  — ALL→OFF starts */
        57.5%           { transform: rotate(6915deg); }  /* 17.25s L6  (normal 60°/s) */
        58.25%          { transform: rotate(6928deg); }  /* 17.48s ~L7 (approaching…) */
        58.28%          { transform: rotate(6945deg); }  /* 17.49s L8  ⏩ SKIPPED L7 — no change! */
        59.17%          { transform: rotate(6945deg); }  /* 17.75s L8  (wait for L8→gray) */
        73.33%          { transform: rotate(7200deg); }  /* 22.00s L1  (L8→L1 at 60°/s) */
        100%            { transform: rotate(12240deg); } /* 30.0s L1 (5040° in 8s, 630°/s) */
      }
      .cursor { animation: cursorSpin 30s linear infinite; transform-origin: 300px 280px; }

      /* ===== Per-light 30s keyframes (infinite loop) ===== */
      @keyframes l1  { 0%,9.99%{fill:#666} 10%,53.32%{fill:#24f} 53.33%,100%{fill:#666} }
      @keyframes l2  { 0%,10.66%{fill:#666} 10.67%,54.16%{fill:#24f} 54.17%,100%{fill:#666} }
      @keyframes l3  { 0%,11.32%{fill:#666} 11.33%,54.99%{fill:#24f} 55%,100%{fill:#666} }
      @keyframes l4  { 0%,11.99%{fill:#666} 12%,55.83%{fill:#24f} 55.84%,100%{fill:#666} }
      @keyframes l5  { 0%,12.66%{fill:#666} 12.67%,56.66%{fill:#24f} 56.67%,100%{fill:#666} }
      @keyframes l6  { 0%,13.32%{fill:#666} 13.33%,57.49%{fill:#24f} 57.5%,100%{fill:#666} }
      @keyframes l7  { 0%,13.99%{fill:#666} 14%,39.99%{fill:#24f} 40%,46.66%{fill:#f22} 46.67%,100%{fill:#666} }
      @keyframes l8  { 0%,14.66%{fill:#666} 14.67%,59.16%{fill:#24f} 59.17%,100%{fill:#666} }
      @keyframes l9  { 0%,15.32%{fill:#666} 15.33%,59.99%{fill:#24f} 60%,100%{fill:#666} }
      @keyframes l10 { 0%,15.99%{fill:#666} 16%,60.83%{fill:#24f} 60.84%,100%{fill:#666} }
      @keyframes l11 { 0%,16.66%{fill:#666} 16.67%,61.66%{fill:#24f} 61.67%,100%{fill:#666} }
      @keyframes l12 { 0%,17.32%{fill:#666} 17.33%,62.49%{fill:#24f} 62.5%,100%{fill:#666} }
      @keyframes l13 { 0%,17.99%{fill:#666} 18%,63.33%{fill:#24f} 63.34%,100%{fill:#666} }
      @keyframes l14 { 0%,18.66%{fill:#666} 18.67%,64.16%{fill:#24f} 64.17%,100%{fill:#666} }
      @keyframes l15 { 0%,19.32%{fill:#666} 19.33%,64.99%{fill:#24f} 65%,100%{fill:#666} }
      @keyframes l16 { 0%,19.99%{fill:#666} 20%,65.83%{fill:#24f} 65.84%,100%{fill:#666} }
      @keyframes l17 { 0%,20.66%{fill:#666} 20.67%,66.66%{fill:#24f} 66.67%,100%{fill:#666} }
      @keyframes l18 { 0%,21.32%{fill:#666} 21.33%,67.49%{fill:#24f} 67.5%,100%{fill:#666} }
      @keyframes l19 { 0%,21.99%{fill:#666} 22%,68.33%{fill:#24f} 68.34%,100%{fill:#666} }
      @keyframes l20 { 0%,22.66%{fill:#666} 22.67%,69.16%{fill:#24f} 69.17%,100%{fill:#666} }
      @keyframes l21 { 0%,23.32%{fill:#666} 23.33%,69.99%{fill:#24f} 70%,100%{fill:#666} }
      @keyframes l22 { 0%,23.99%{fill:#666} 24%,70.83%{fill:#24f} 70.84%,100%{fill:#666} }
      @keyframes l23 { 0%,24.66%{fill:#666} 24.67%,71.66%{fill:#24f} 71.67%,100%{fill:#666} }
      @keyframes l24 { 0%,25.32%{fill:#666} 25.33%,72.49%{fill:#24f} 72.5%,100%{fill:#666} }

      .a1  { animation: l1  30s linear infinite; }
      .a2  { animation: l2  30s linear infinite; }
      .a3  { animation: l3  30s linear infinite; }
      .a4  { animation: l4  30s linear infinite; }
      .a5  { animation: l5  30s linear infinite; }
      .a6  { animation: l6  30s linear infinite; }
      .a7p { animation: l7  30s linear infinite, pulse7 30s linear infinite; }
      .a8  { animation: l8  30s linear infinite; }
      .a9  { animation: l9  30s linear infinite; }
      .a10 { animation: l10 30s linear infinite; }
      .a11 { animation: l11 30s linear infinite; }
      .a12 { animation: l12 30s linear infinite; }
      .a13 { animation: l13 30s linear infinite; }
      .a14 { animation: l14 30s linear infinite; }
      .a15 { animation: l15 30s linear infinite; }
      .a16 { animation: l16 30s linear infinite; }
      .a17 { animation: l17 30s linear infinite; }
      .a18 { animation: l18 30s linear infinite; }
      .a19 { animation: l19 30s linear infinite; }
      .a20 { animation: l20 30s linear infinite; }
      .a21 { animation: l21 30s linear infinite; }
      .a22 { animation: l22 30s linear infinite; }
      .a23 { animation: l23 30s linear infinite; }
      .a24 { animation: l24 30s linear infinite; }

      /* ===== Event panel ===== */
      @keyframes ev1 { 0%,9%{opacity:0} 10%,30%{opacity:1} 31%,100%{opacity:0} }
      @keyframes ev2 { 0%,39%{opacity:0} 40%,42%{opacity:1} 43%,100%{opacity:0} }
      @keyframes ev3 { 0%,45%{opacity:0} 46%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes ev4 { 0%,52%{opacity:0} 53%,77%{opacity:1} 78%,100%{opacity:0} }
      .ev1 { animation: ev1 30s linear infinite; }
      .ev2 { animation: ev2 30s linear infinite; }
      .ev3 { animation: ev3 30s linear infinite; }
      .ev4 { animation: ev4 30s linear infinite; }

      /* ===== Timer bar ===== */
      @keyframes timerBar { 0% { width: 0; } 100% { width: 488px; } }
      .timer-fill { animation: timerBar 30s linear infinite; }

      /* ===== Light 7 red pulse (only during events) ===== */
      @keyframes pulse7 {
        0%,39.5%{stroke:#444;stroke-opacity:0;stroke-width:1.5}
        40%,41.5%{stroke:#f22;stroke-opacity:1;stroke-width:3}
        42%,46.2%{stroke:#444;stroke-opacity:0;stroke-width:1.5}
        46.3%,47.5%{stroke:#f22;stroke-opacity:1;stroke-width:3}
        47.6%,100%{stroke:#444;stroke-opacity:0;stroke-width:1.5}
      }
    </style>
  </defs>

  <rect width="720" height="560" fill="#1a1a2e" rx="12"/>

  <!-- ====== 24 lights (center 300,280 r=165, top=0°, clockwise, 15° steps) ====== -->
  <circle cx="300" cy="115" r="11" class="a1" fill="#666" stroke="#444" stroke-width="1.5"/>
  <text x="300" y="119" text-anchor="middle" fill="#fff" font-size="8">1</text>

  <circle cx="342.7" cy="120.6" r="11" class="a2" fill="#666" stroke="#444" stroke-width="1.5"/>
  <text x="342.7" y="124.6" text-anchor="middle" fill="#fff" font-size="8">2</text>

  <circle cx="382.5" cy="137.1" r="11" class="a3" fill="#666" stroke="#444" stroke-width="1.5"/>
  <text x="382.5" y="141.1" text-anchor="middle" fill="#fff" font-size="8">3</text>

  <circle cx="416.7" cy="163.3" r="11" class="a4" fill="#666" stroke="#444" stroke-width="1.5"/>
  <text x="416.7" y="167.3" text-anchor="middle" fill="#fff" font-size="8">4</text>

  <circle cx="442.9" cy="197.5" r="11" class="a5" fill="#666" stroke="#444" stroke-width="1.5"/>
  <text x="442.9" y="201.5" text-anchor="middle" fill="#fff" font-size="8">5</text>

  <circle cx="459.4" cy="237.3" r="11" class="a6" fill="#666" stroke="#444" stroke-width="1.5"/>
  <text x="459.4" y="241.3" text-anchor="middle" fill="#fff" font-size="8">6</text>

  <!-- L7: blue→red→gray, pulse ring only during events -->
  <circle cx="465" cy="280" r="13" class="a7p" fill="#666" stroke="#444" stroke-width="1.5"/>
  <text x="465" y="284" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">7</text>

  <circle cx="459.4" cy="322.7" r="11" class="a8" fill="#666" stroke="#444" stroke-width="1.5"/>
  <text x="459.4" y="326.7" text-anchor="middle" fill="#fff" font-size="8">8</text>

  <circle cx="442.9" cy="362.5" r="11" class="a9" fill="#666" stroke="#444" stroke-width="1.5"/>
  <text x="442.9" y="366.5" text-anchor="middle" fill="#fff" font-size="8">9</text>

  <circle cx="416.7" cy="396.7" r="11" class="a10" fill="#666" stroke="#444" stroke-width="1.5"/>
  <text x="416.7" y="400.7" text-anchor="middle" fill="#fff" font-size="8">10</text>

  <circle cx="382.5" cy="422.9" r="11" class="a11" fill="#666" stroke="#444" stroke-width="1.5"/>
  <text x="382.5" y="426.9" text-anchor="middle" fill="#fff" font-size="8">11</text>

  <circle cx="342.7" cy="439.4" r="11" class="a12" fill="#666" stroke="#444" stroke-width="1.5"/>
  <text x="342.7" y="443.4" text-anchor="middle" fill="#fff" font-size="8">12</text>

  <circle cx="300" cy="445" r="11" class="a13" fill="#666" stroke="#444" stroke-width="1.5"/>
  <text x="300" y="449" text-anchor="middle" fill="#fff" font-size="8">13</text>

  <circle cx="257.3" cy="439.4" r="11" class="a14" fill="#666" stroke="#444" stroke-width="1.5"/>
  <text x="257.3" y="443.4" text-anchor="middle" fill="#fff" font-size="8">14</text>

  <circle cx="217.5" cy="422.9" r="11" class="a15" fill="#666" stroke="#444" stroke-width="1.5"/>
  <text x="217.5" y="426.9" text-anchor="middle" fill="#fff" font-size="8">15</text>

  <circle cx="183.3" cy="396.7" r="11" class="a16" fill="#666" stroke="#444" stroke-width="1.5"/>
  <text x="183.3" y="400.7" text-anchor="middle" fill="#fff" font-size="8">16</text>

  <circle cx="157.1" cy="362.5" r="11" class="a17" fill="#666" stroke="#444" stroke-width="1.5"/>
  <text x="157.1" y="366.5" text-anchor="middle" fill="#fff" font-size="8">17</text>

  <circle cx="140.6" cy="322.7" r="11" class="a18" fill="#666" stroke="#444" stroke-width="1.5"/>
  <text x="140.6" y="326.7" text-anchor="middle" fill="#fff" font-size="8">18</text>

  <circle cx="135" cy="280" r="11" class="a19" fill="#666" stroke="#444" stroke-width="1.5"/>
  <text x="135" y="284" text-anchor="middle" fill="#fff" font-size="8">19</text>

  <circle cx="140.6" cy="237.3" r="11" class="a20" fill="#666" stroke="#444" stroke-width="1.5"/>
  <text x="140.6" y="241.3" text-anchor="middle" fill="#fff" font-size="8">20</text>

  <circle cx="157.1" cy="197.5" r="11" class="a21" fill="#666" stroke="#444" stroke-width="1.5"/>
  <text x="157.1" y="201.5" text-anchor="middle" fill="#fff" font-size="8">21</text>

  <circle cx="183.3" cy="163.3" r="11" class="a22" fill="#666" stroke="#444" stroke-width="1.5"/>
  <text x="183.3" y="167.3" text-anchor="middle" fill="#fff" font-size="8">22</text>

  <circle cx="217.5" cy="137.1" r="11" class="a23" fill="#666" stroke="#444" stroke-width="1.5"/>
  <text x="217.5" y="141.1" text-anchor="middle" fill="#fff" font-size="8">23</text>

  <circle cx="257.3" cy="120.6" r="11" class="a24" fill="#666" stroke="#444" stroke-width="1.5"/>
  <text x="257.3" y="124.6" text-anchor="middle" fill="#fff" font-size="8">24</text>

  <!-- Cursor -->
  <g class="cursor">
    <polygon points="300,108 288,126 312,126" fill="#ff0" opacity="0.95"/>
  </g>

  <!-- Center -->
  <circle cx="300" cy="280" r="30" fill="#16213e" stroke="#555" stroke-width="2"/>
  <text x="300" y="275" text-anchor="middle" fill="#aaa" font-size="7">RING</text>
  <text x="300" y="287" text-anchor="middle" fill="#aaa" font-size="7">POLL</text>

  <!-- ====== Right panel ====== -->
  <rect x="530" y="50" width="175" height="250" fill="none" stroke="#333" stroke-width="1" rx="6"/>
  <text x="618" y="68" text-anchor="middle" fill="#777" font-size="9" font-weight="bold">DMX EVENTS</text>

  <rect x="542" y="80" width="151" height="44" class="ev1" fill="#24f" opacity="0.1" rx="6" stroke="#24f" stroke-width="1" stroke-opacity="0.3"/>
  <text x="618" y="97" text-anchor="middle" class="ev1" fill="#48f" font-size="11" font-weight="bold">📥 ALL → BLUE</text>
  <text x="618" y="113" text-anchor="middle" class="ev1" fill="#68f" font-size="8">t=3.0s · 24× block</text>

  <rect x="542" y="134" width="151" height="44" class="ev2" fill="#f22" opacity="0.1" rx="6" stroke="#f22" stroke-width="1" stroke-opacity="0.3"/>
  <text x="618" y="151" text-anchor="middle" class="ev2" fill="#f44" font-size="11" font-weight="bold">📥 LIGHT 7→RED</text>
  <text x="618" y="167" text-anchor="middle" class="ev2" fill="#f66" font-size="8">t=12.0s · ⚡ block</text>

  <rect x="542" y="188" width="151" height="44" class="ev3" fill="#888" opacity="0.1" rx="6" stroke="#888" stroke-width="1" stroke-opacity="0.3"/>
  <text x="618" y="205" text-anchor="middle" class="ev3" fill="#aaa" font-size="11" font-weight="bold">📥 LIGHT 7→OFF</text>
  <text x="618" y="221" text-anchor="middle" class="ev3" fill="#999" font-size="8">t=14.0s · ⚡ block</text>

  <rect x="542" y="242" width="151" height="44" class="ev4" fill="#888" opacity="0.1" rx="6" stroke="#888" stroke-width="1" stroke-opacity="0.3"/>
  <text x="618" y="259" text-anchor="middle" class="ev4" fill="#aaa" font-size="11" font-weight="bold">📥 ALL → OFF</text>
  <text x="618" y="275" text-anchor="middle" class="ev4" fill="#999" font-size="8">t=16.0s · 24× block</text>

  <!-- L7 skip indicator during ALL→OFF (cursor passes L7, no change needed) -->

  <!-- ====== Timer bar ====== -->
  <rect x="18" y="498" width="488" height="18" fill="#1a1a30" rx="4" stroke="#444" stroke-width="0.5"/>
  <rect x="19" y="499" width="0" height="16" fill="#24f" opacity="0.35" rx="3" class="timer-fill"/>

  <!-- Tick marks -->
  <line x1="19" y1="494" x2="19" y2="520" stroke="#555" stroke-width="0.5"/>
  <text x="19" y="534" text-anchor="middle" fill="#555" font-size="8">0s</text>

  <line x1="68" y1="494" x2="68" y2="520" stroke="#48f" stroke-width="1"/>
  <text x="68" y="534" text-anchor="middle" fill="#48f" font-size="8">3.0s</text>

  <line x1="145" y1="494" x2="145" y2="520" stroke="#48f" stroke-width="0.5"/>
  <text x="145" y="534" text-anchor="middle" fill="#48f" font-size="8">7.8s</text>

  <line x1="214" y1="494" x2="214" y2="520" stroke="#f44" stroke-width="1"/>
  <text x="214" y="527" text-anchor="middle" fill="#f44" font-size="8">12.0s</text>

  <line x1="246" y1="494" x2="246" y2="520" stroke="#aaa" stroke-width="1"/>
  <text x="246" y="527" text-anchor="middle" fill="#aaa" font-size="8">14.0s</text>

  <line x1="279" y1="494" x2="279" y2="520" stroke="#aaa" stroke-width="1"/>
  <text x="279" y="527" text-anchor="middle" fill="#aaa" font-size="8">16.0s</text>

  <line x1="376" y1="494" x2="376" y2="520" stroke="#aaa" stroke-width="0.5"/>
  <text x="376" y="534" text-anchor="middle" fill="#aaa" font-size="8">22.0s</text>

  <line x1="506" y1="494" x2="506" y2="520" stroke="#555" stroke-width="0.5"/>
  <text x="506" y="534" text-anchor="middle" fill="#555" font-size="8">30s</text>

  <!-- Phase labels -->
  <text x="43" y="492" text-anchor="middle" fill="#334" font-size="7">fast</text>
  <text x="107" y="491" text-anchor="middle" fill="#48f" font-size="8" font-weight="bold">ALL→BLUE</text>
  <text x="180" y="492" text-anchor="middle" fill="#334" font-size="7">fast</text>
  <text x="230" y="491" text-anchor="middle" fill="#844" font-size="7">L7</text>
  <text x="328" y="491" text-anchor="middle" fill="#aaa" font-size="8" font-weight="bold">ALL→OFF</text>
  <text x="441" y="492" text-anchor="middle" fill="#334" font-size="7">fast</text>

</svg>
