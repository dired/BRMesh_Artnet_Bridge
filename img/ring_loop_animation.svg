<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="monospace">
  <defs>
    <style>
      /* ===== Cursor: 16.4s total, ALL→BLUE/ALL→OFF = 2.4s (24×0.1s), fast ~520-720°/s ===== */
      @keyframes cursorSpin {
        0%              { transform: rotate(0deg); }     /*  0.0s  L1 */
        18.29%          { transform: rotate(1800deg); }  /*  3.0s  L1 (5 revs, 600°/s) */
        32.93%          { transform: rotate(2160deg); }  /*  5.4s  L1 (1 rev, 150°/s: ALL→BLUE 2.4s) */
        54.88%          { transform: rotate(4410deg); }  /*  9.0s  L7 (2250°/3.6s, 625°/s) */
        55.49%          { transform: rotate(4410deg); }  /*  9.1s  BLOCKED at L7 */
        67.07%          { transform: rotate(5490deg); }  /* 11.0s  L7 (1080°/1.9s, 568°/s) */
        67.68%          { transform: rotate(5490deg); }  /* 11.1s  BLOCKED at L7 */
        79.27%          { transform: rotate(6480deg); }  /* 13.0s  L1 (990°/1.9s, 521°/s) */
        82.32%          { transform: rotate(6555deg); }  /* 13.5s  L6 (normal 150°/s) */
        82.87%          { transform: rotate(6569deg); }  /* 13.59s ~L7 (approaching…) */
        82.93%          { transform: rotate(6585deg); }  /* 13.60s L8  ⏩ SKIPPED L7 — no change! */
        83.54%          { transform: rotate(6585deg); }  /* 13.70s L8  (wait for L8→gray) */
        93.90%          { transform: rotate(6840deg); }  /* 15.4s  L1 (1 rev, 150°/s: ALL→OFF 2.4s) */
        100%            { transform: rotate(7200deg); }  /* 16.4s  L1 (360° in 1s, 360°/s) */
      }
      .cursor { animation: cursorSpin 16.4s linear infinite; transform-origin: 300px 280px; }

      /* ===== Per-light 16.4s keyframes (infinite loop, ALL→BLUE/ALL→OFF = 2.4s, 0.1s/light) ===== */
      @keyframes l1  { 0%,18.28%{fill:#666} 18.29%,79.26%{fill:#24f} 79.27%,100%{fill:#666} }
      @keyframes l2  { 0%,18.89%{fill:#666} 18.90%,79.87%{fill:#24f} 79.88%,100%{fill:#666} }
      @keyframes l3  { 0%,19.50%{fill:#666} 19.51%,80.48%{fill:#24f} 80.49%,100%{fill:#666} }
      @keyframes l4  { 0%,20.11%{fill:#666} 20.12%,81.09%{fill:#24f} 81.10%,100%{fill:#666} }
      @keyframes l5  { 0%,20.72%{fill:#666} 20.73%,81.70%{fill:#24f} 81.71%,100%{fill:#666} }
      @keyframes l6  { 0%,21.33%{fill:#666} 21.34%,82.31%{fill:#24f} 82.32%,100%{fill:#666} }
      @keyframes l7  { 0%,21.94%{fill:#666} 21.95%,54.88%{fill:#24f} 54.89%,67.68%{fill:#f22} 67.69%,100%{fill:#666} }
      @keyframes l8  { 0%,22.55%{fill:#666} 22.56%,83.53%{fill:#24f} 83.54%,100%{fill:#666} }
      @keyframes l9  { 0%,23.16%{fill:#666} 23.17%,84.14%{fill:#24f} 84.15%,100%{fill:#666} }
      @keyframes l10 { 0%,23.77%{fill:#666} 23.78%,84.75%{fill:#24f} 84.76%,100%{fill:#666} }
      @keyframes l11 { 0%,24.38%{fill:#666} 24.39%,85.36%{fill:#24f} 85.37%,100%{fill:#666} }
      @keyframes l12 { 0%,24.99%{fill:#666} 25.00%,85.97%{fill:#24f} 85.98%,100%{fill:#666} }
      @keyframes l13 { 0%,25.60%{fill:#666} 25.61%,86.58%{fill:#24f} 86.59%,100%{fill:#666} }
      @keyframes l14 { 0%,26.21%{fill:#666} 26.22%,87.19%{fill:#24f} 87.20%,100%{fill:#666} }
      @keyframes l15 { 0%,26.82%{fill:#666} 26.83%,87.79%{fill:#24f} 87.80%,100%{fill:#666} }
      @keyframes l16 { 0%,27.43%{fill:#666} 27.44%,88.40%{fill:#24f} 88.41%,100%{fill:#666} }
      @keyframes l17 { 0%,28.04%{fill:#666} 28.05%,89.01%{fill:#24f} 89.02%,100%{fill:#666} }
      @keyframes l18 { 0%,28.65%{fill:#666} 28.66%,89.62%{fill:#24f} 89.63%,100%{fill:#666} }
      @keyframes l19 { 0%,29.26%{fill:#666} 29.27%,90.23%{fill:#24f} 90.24%,100%{fill:#666} }
      @keyframes l20 { 0%,29.87%{fill:#666} 29.88%,90.84%{fill:#24f} 90.85%,100%{fill:#666} }
      @keyframes l21 { 0%,30.48%{fill:#666} 30.49%,91.45%{fill:#24f} 91.46%,100%{fill:#666} }
      @keyframes l22 { 0%,31.09%{fill:#666} 31.10%,92.06%{fill:#24f} 92.07%,100%{fill:#666} }
      @keyframes l23 { 0%,31.70%{fill:#666} 31.71%,92.67%{fill:#24f} 92.68%,100%{fill:#666} }
      @keyframes l24 { 0%,32.31%{fill:#666} 32.32%,93.28%{fill:#24f} 93.29%,100%{fill:#666} }

      .a1  { animation: l1  16.4s linear infinite; }
      .a2  { animation: l2  16.4s linear infinite; }
      .a3  { animation: l3  16.4s linear infinite; }
      .a4  { animation: l4  16.4s linear infinite; }
      .a5  { animation: l5  16.4s linear infinite; }
      .a6  { animation: l6  16.4s linear infinite; }
      .a7p { animation: l7  16.4s linear infinite, pulse7 16.4s linear infinite; }
      .a8  { animation: l8  16.4s linear infinite; }
      .a9  { animation: l9  16.4s linear infinite; }
      .a10 { animation: l10 16.4s linear infinite; }
      .a11 { animation: l11 16.4s linear infinite; }
      .a12 { animation: l12 16.4s linear infinite; }
      .a13 { animation: l13 16.4s linear infinite; }
      .a14 { animation: l14 16.4s linear infinite; }
      .a15 { animation: l15 16.4s linear infinite; }
      .a16 { animation: l16 16.4s linear infinite; }
      .a17 { animation: l17 16.4s linear infinite; }
      .a18 { animation: l18 16.4s linear infinite; }
      .a19 { animation: l19 16.4s linear infinite; }
      .a20 { animation: l20 16.4s linear infinite; }
      .a21 { animation: l21 16.4s linear infinite; }
      .a22 { animation: l22 16.4s linear infinite; }
      .a23 { animation: l23 16.4s linear infinite; }
      .a24 { animation: l24 16.4s linear infinite; }

      /* ===== Event panel ===== */
      @keyframes ev1 { 0%,17%{opacity:0} 18%,36%{opacity:1} 37%,100%{opacity:0} }
      @keyframes ev2 { 0%,54%{opacity:0} 55%,57%{opacity:1} 58%,100%{opacity:0} }
      @keyframes ev3 { 0%,66%{opacity:0} 67%,69%{opacity:1} 70%,100%{opacity:0} }
      @keyframes ev4 { 0%,78%{opacity:0} 79%,95%{opacity:1} 96%,100%{opacity:0} }
      .ev1 { animation: ev1 16.4s linear infinite; }
      .ev2 { animation: ev2 16.4s linear infinite; }
      .ev3 { animation: ev3 16.4s linear infinite; }
      .ev4 { animation: ev4 16.4s linear infinite; }

      /* ===== Timer bar ===== */
      @keyframes timerBar { 0% { width: 0; } 100% { width: 488px; } }
      .timer-fill { animation: timerBar 16.4s linear infinite; }

      /* ===== Light 7 red pulse (only during events) ===== */
      @keyframes pulse7 {
        0%,54.4%{stroke:#444;stroke-opacity:0;stroke-width:1.5}
        54.5%,55.8%{stroke:#f22;stroke-opacity:1;stroke-width:3}
        55.9%,66.6%{stroke:#444;stroke-opacity:0;stroke-width:1.5}
        66.7%,68.0%{stroke:#f22;stroke-opacity:1;stroke-width:3}
        68.1%,100%{stroke:#444;stroke-opacity:0;stroke-width:1.5}
      }
    </style>
  </defs>

  <rect width="720" height="560" fill="#1a1a2e" rx="12"/>

  <!-- ====== 24 lights (center 300,280 r=165, top=0°, clockwise, 15° steps) ====== -->
  <circle cx="300" cy="115" r="11" class="a1" fill="#666" stroke="#444" stroke-width="1.5"/>
  <text x="300" y="119" text-anchor="middle" fill="#fff" font-size="8">1</text>

  <circle cx="342.7" cy="120.6" r="11" class="a2" fill="#666" stroke="#444" stroke-width="1.5"/>
  <text x="342.7" y="124.6" text-anchor="middle" fill="#fff" font-size="8">2</text>

  <circle cx="382.5" cy="137.1" r="11" class="a3" fill="#666" stroke="#444" stroke-width="1.5"/>
  <text x="382.5" y="141.1" text-anchor="middle" fill="#fff" font-size="8">3</text>

  <circle cx="416.7" cy="163.3" r="11" class="a4" fill="#666" stroke="#444" stroke-width="1.5"/>
  <text x="416.7" y="167.3" text-anchor="middle" fill="#fff" font-size="8">4</text>

  <circle cx="442.9" cy="197.5" r="11" class="a5" fill="#666" stroke="#444" stroke-width="1.5"/>
  <text x="442.9" y="201.5" text-anchor="middle" fill="#fff" font-size="8">5</text>

